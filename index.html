<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPE Entrega 1 - Grupo 29</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Fondo oscuro estilo Kingly Games */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #252526; /* Gris oscuro para la tarjeta */
            padding: 40px 60px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        h2 {
            font-size: 18px;
            color: #a0a0a0;
            font-weight: 400;
            margin-bottom: 25px;
        }
        .nombres {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .botones {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-editor {
            background-color: #383838;
            color: #ffffff;
            border: 1px solid #555;
        }
        .btn-editor:hover {
            background-color: #4d4d4d;
        }
        .btn-presentacion {
            background-color: #6002EE; /* El morado/violeta de tus botones */
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(96, 2, 238, 0.4);
        }
        .btn-presentacion:hover {
            background-color: #7928FF;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>TPE Entrega 1</h1>
        <h2>Grupo 29</h2>
        
        <div class="nombres">
            Enzo Marcelo Martín<br>
            Franco Martin Monsalvo
        </div>

        <div class="botones">
            
            <a href="https://www.figma.com/design/QHhI9gKBXPz3Hw0zUxA99H/TPE-Grupo-29?t=OexWVG8nvfySCXso-1" target="_blank" class="btn btn-editor">Modo Editor</a>
            <a href="https://www.figma.com/proto/QHhI9gKBXPz3Hw0zUxA99H/TPE-Grupo-29?node-id=645-15263&p=f&t=psq1Gdo6p7OLjsph-1&scaling=scale-down-width&content-scaling=fixed&page-id=1%3A2&starting-point-node-id=645%3A15263" target="_blank" class="btn btn-presentacion">Modo Presentación</a>
        </div>
    </div>
</body>
</html>
